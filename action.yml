name: i18n-cli
author: molesignal
branding:
  icon: globe
  color: blue
description: Translate changed JSON strings through an OpenAI-compatible API
inputs:
  config:
    description: Configuration path in the calling repository
    default: i18n.config.json
  api-key:
    description: API key (pass a GitHub Actions secret)
    required: true
  base-url:
    description: Optional API base URL override
  model:
    description: Optional model override
  dry-run:
    description: Preview pending translations without API calls or file writes
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: false
    - name: Build CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/i18n-cli" ./cmd/i18n-cli
    - name: Translate
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.api-key }}
        OPENAI_BASE_URL: ${{ inputs.base-url }}
        OPENAI_MODEL: ${{ inputs.model }}
        I18N_CONFIG_PATH: ${{ inputs.config }}
        I18N_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        args=(translate --config "$I18N_CONFIG_PATH")
        if [[ "$I18N_DRY_RUN" == "true" ]]; then
          args+=(--dry-run)
        fi
        "$RUNNER_TEMP/i18n-cli" "${args[@]}"
